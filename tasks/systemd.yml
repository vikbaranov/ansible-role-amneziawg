---
# tasks/systemd.yml - Deploy AmneziaWG systemd unit

- name: Deploy systemd service template
  ansible.builtin.template:
    src: amneziawg@.service.j2
    dest: /etc/systemd/system/amneziawg@.service
    owner: root
    group: root
    mode: '0644'
  become: true
  tags:
    - amneziawg-install

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  tags:
    - amneziawg-install
