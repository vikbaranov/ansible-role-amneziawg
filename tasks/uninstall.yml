---
# tasks/uninstall.yml - Full teardown of AmneziaWG

- name: Stop AmneziaWG service
  ansible.builtin.systemd:
    name: 'amneziawg@{{ amneziawg_interface }}'
    state: stopped
    enabled: false
  become: true
  failed_when: false
  tags:
    - amneziawg-uninstall

- name: Remove systemd service template
  ansible.builtin.file:
    path: /etc/systemd/system/amneziawg@.service
    state: absent
  become: true
  tags:
    - amneziawg-uninstall

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  tags:
    - amneziawg-uninstall

- name: Check if Docker container exists
  ansible.builtin.command:
    cmd: docker container inspect {{ amneziawg_interface }}
  register: amneziawg__container_check
  become: true
  failed_when: false
  changed_when: false
  tags:
    - amneziawg-uninstall

- name: Remove Docker container
  when: amneziawg__container_check.rc == 0
  ansible.builtin.command:
    cmd: docker rm -f {{ amneziawg_interface }}
  become: true
  changed_when: true
  tags:
    - amneziawg-uninstall

- name: Check if Docker image exists
  when: amneziawg_remove_docker_image | bool
  ansible.builtin.command:
    cmd: docker image inspect {{ amneziawg_image }}
  register: amneziawg__remove_image_check
  become: true
  failed_when: false
  changed_when: false
  tags:
    - amneziawg-uninstall

- name: Remove Docker image
  when:
    - amneziawg_remove_docker_image | bool
    - (amneziawg__remove_image_check.rc | default(1)) == 0
  ansible.builtin.command:
    cmd: docker rmi {{ amneziawg_image }}
  become: true
  changed_when: true
  tags:
    - amneziawg-uninstall

- name: Remove entrypoint script
  ansible.builtin.file:
    path: /usr/local/bin/amneziawg-entrypoint.sh
    state: absent
  become: true
  tags:
    - amneziawg-uninstall

- name: Remove configuration directory
  when: amneziawg_remove_configs | bool
  ansible.builtin.file:
    path: '{{ amneziawg_remote_directory }}'
    state: absent
  become: true
  tags:
    - amneziawg-uninstall

- name: Remove forwarding sysctl
  ansible.builtin.file:
    path: /etc/sysctl.d/99-amneziawg-forward.conf
    state: absent
  become: true
  tags:
    - amneziawg-uninstall
