---
# tasks/sysctl.yml - Configure host forwarding sysctls

- name: Enable IP forwarding (IPv4)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-amneziawg-forward.conf
    reload: true
  become: true
  tags:
    - amneziawg-config

- name: Enable src_valid_mark
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.src_valid_mark
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-amneziawg-forward.conf
    reload: true
  become: true
  tags:
    - amneziawg-config

- name: Enable IP forwarding (IPv6)
  when: amneziawg_enable_ipv6_forwarding | default(false)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-amneziawg-forward.conf
    reload: true
  become: true
  tags:
    - amneziawg-config
