---
# tasks/service.yml - Manage AmneziaWG service state

- name: Enable AmneziaWG service (docker)
  when: amneziawg_install_method == 'docker'
  ansible.builtin.systemd:
    name: 'amneziawg@{{ amneziawg_interface }}'
    enabled: '{{ amneziawg_service_enabled }}'
  become: true
  tags:
    - amneziawg

- name: Start AmneziaWG service (docker)
  when: amneziawg_install_method == 'docker'
  ansible.builtin.systemd:
    name: 'amneziawg@{{ amneziawg_interface }}'
    state: '{{ amneziawg_service_state }}'
  become: true
  tags:
    - amneziawg

- name: Verify service is running (docker)
  when: amneziawg_install_method == 'docker'
  ansible.builtin.systemd:
    name: 'amneziawg@{{ amneziawg_interface }}'
  register: amneziawg__service_check
  retries: 3
  delay: 5
  until: amneziawg__service_check.status.ActiveState == 'active'
  become: true
  tags:
    - amneziawg

- name: Enable AmneziaWG service (native)
  when: amneziawg_install_method == 'native'
  ansible.builtin.systemd:
    name: 'awg-quick@{{ amneziawg_interface }}'
    enabled: '{{ amneziawg_service_enabled }}'
  become: true
  tags:
    - amneziawg

- name: Start AmneziaWG service (native)
  when: amneziawg_install_method == 'native'
  ansible.builtin.systemd:
    name: 'awg-quick@{{ amneziawg_interface }}'
    state: '{{ amneziawg_service_state }}'
  become: true
  tags:
    - amneziawg

- name: Verify service is running (native)
  when: amneziawg_install_method == 'native'
  ansible.builtin.systemd:
    name: 'awg-quick@{{ amneziawg_interface }}'
  register: amneziawg__service_check
  retries: 3
  delay: 5
  until: amneziawg__service_check.status.ActiveState == 'active'
  become: true
  tags:
    - amneziawg
