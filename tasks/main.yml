---
# tasks/main.yml - Main entry point

- name: Validate role state
  ansible.builtin.assert:
    that:
      - amneziawg_state in ['present', 'absent']
      - amneziawg_install_method in ['docker', 'native']
    fail_msg: >-
      amneziawg_state must be 'present' or 'absent',
      amneziawg_install_method must be 'docker' or 'native'
    quiet: true
  tags:
    - amneziawg

- name: Validate native mode requirements
  when:
    - amneziawg_state == 'present'
    - amneziawg_install_method == 'native'
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "amneziawg_install_method='native' requires Ubuntu (PPA is Ubuntu-only). Use 'docker' for other distributions."
    quiet: true
  tags:
    - amneziawg

- name: Install and configure AmneziaWG
  when: amneziawg_state == 'present'
  block:
    - name: Validate required server variables
      ansible.builtin.assert:
        that:
          - amneziawg_addresses is defined
          - amneziawg_addresses | length > 0
        fail_msg: "amneziawg_addresses must be defined with at least one VPN address"
        quiet: true
      tags:
        - amneziawg-config

    # ── Docker install path ──────────────────────────────────────────
    - name: Ensure Docker is available
      when: amneziawg_install_method == 'docker'
      ansible.builtin.include_tasks:
        file: docker.yml
      tags:
        - amneziawg
        - amneziawg-install

    - name: Ensure AmneziaWG image is available
      when: amneziawg_install_method == 'docker'
      ansible.builtin.include_tasks:
        file: image.yml
      tags:
        - amneziawg
        - amneziawg-install

    - name: Deploy AmneziaWG entrypoint
      when: amneziawg_install_method == 'docker'
      ansible.builtin.include_tasks:
        file: entrypoint.yml
      tags:
        - amneziawg
        - amneziawg-install

    - name: Deploy AmneziaWG systemd unit
      when: amneziawg_install_method == 'docker'
      ansible.builtin.include_tasks:
        file: systemd.yml
      tags:
        - amneziawg
        - amneziawg-install

    # ── Native install path ──────────────────────────────────────────
    - name: Install AmneziaWG from PPA
      when: amneziawg_install_method == 'native'
      ansible.builtin.include_tasks:
        file: native-install.yml
      tags:
        - amneziawg
        - amneziawg-install

    - name: Configure native systemd service
      when: amneziawg_install_method == 'native'
      ansible.builtin.include_tasks:
        file: native-systemd.yml
      tags:
        - amneziawg
        - amneziawg-install

    - name: Generate AmneziaWG keys
      ansible.builtin.include_tasks:
        file: keys.yml
      tags:
        - amneziawg
        - amneziawg-keys
        - amneziawg-clients

    - name: Assemble peer list
      ansible.builtin.include_tasks:
        file: peers.yml
      tags:
        - amneziawg
        - amneziawg-config

    - name: Configure host forwarding
      ansible.builtin.include_tasks:
        file: sysctl.yml
      tags:
        - amneziawg
        - amneziawg-config

    - name: Deploy AmneziaWG configuration
      ansible.builtin.include_tasks:
        file: config.yml
      tags:
        - amneziawg
        - amneziawg-config

    - name: Manage AmneziaWG service
      ansible.builtin.include_tasks:
        file: service.yml
      tags:
        - amneziawg
        - amneziawg-config

    - name: Manage AmneziaWG clients
      ansible.builtin.include_tasks:
        file: clients.yml
      when: amneziawg_client_action | default('') | length > 0
      tags:
        - amneziawg
        - amneziawg-clients

- name: Remove AmneziaWG
  when: amneziawg_state == 'absent'
  ansible.builtin.include_tasks:
    file: uninstall.yml
  tags:
    - amneziawg
    - amneziawg-uninstall
